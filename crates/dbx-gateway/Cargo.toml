[package]
name = "dbx-gateway"
version = "0.5.83"
edition = "2021"
license = "Apache-2.0"

[features]
default = ["server"]
server = [
    "dep:arc-swap",
    "dep:argon2",
    "dep:clap",
    "dep:futures-util",
    "dep:hex",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:libc",
    "dep:p12-keystore",
    "dep:pkcs8",
    "dep:rcgen",
    "dep:rusqlite",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:sha2",
    "dep:time",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tokio-tungstenite",
    "dep:toml",
    "dep:x509-parser",
    "dep:zeroize",
]

[[bin]]
name = "dbx-gateway"
path = "src/bin/dbx-gateway.rs"
required-features = ["server"]

[[bin]]
name = "dbx-gateway-pki"
path = "src/bin/dbx-gateway-pki.rs"
required-features = ["server"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

arc-swap = { version = "1", optional = true }
argon2 = { version = "0.5", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
futures-util = { version = "0.3", optional = true }
hex = { version = "0.4", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1", "http2"], optional = true }
hyper-rustls = { version = "0.27", features = ["http1", "http2", "webpki-roots"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"], optional = true }
libc = { version = "0.2", optional = true }
p12-keystore = { version = "0.2", optional = true }
pkcs8 = { version = "=0.11.0-rc.11", default-features = false, features = ["encryption", "pem"], optional = true }
rcgen = { version = "0.14", features = ["x509-parser"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
rustls = { version = "0.23", features = ["aws-lc-rs"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
sha2 = { version = "0.10", optional = true }
time = { version = "0.3", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
toml = { version = "0.8", optional = true }
x509-parser = { version = "0.18", optional = true }
zeroize = { version = "1", features = ["derive", "serde"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["process", "test-util"] }
